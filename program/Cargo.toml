[package]
name = "solana-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_escrow"

[features]
no-entrypoint = []
test-bpf = []

[dependencies]
solana-program = "1.18"
borsh = "0.9"
thiserror = "1.0"

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
tokio = { version = "1", features = ["full"] }

[profile.release]
overflow-checks = true
lto = "thin"
opt-level = 3
incremental = false
codegen-units = 1
